disease: Spinal Muscular Atrophy (SMA)
gene: SMN2 (Survival Motor Neuron 2)
region: Intron 7 intronic splicing silencer N1 (ISS-N1)
why_structure_matters: |
  Nusinersen (Spinraza) is an FDA-approved antisense oligonucleotide (ASO) that targets
  ISS-N1 to restore SMN2 exon 7 inclusion. The local RNA structure affects ASO accessibility
  and binding kinetics. Understanding ensemble pairing probabilities informs ASO design.
teaching_point: |
  ASO site selection requires assessing local pairing probability, not just MFE cartoons.
  Stems that look firm in the MFE but are floppy in the ensemble may be better ASO targets.
coordinates: "NM_017411.4 intron 7 ISS-N1 neighborhood (approx positions 840-1040)"
