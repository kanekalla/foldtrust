disease: Hepatitis C
gene: HCV (Hepatitis C Virus genotype 1a strain H77)
region: IRES domain II
why_structure_matters: |
  The HCV internal ribosome entry site (IRES) directs cap-independent translation initiation.
  Domain II is a structured element within the 5' NTR that contributes to IRES architecture.
  Accurate ensemble folding is essential for understanding how the IRES recruits ribosomes
  and for designing small-molecule inhibitors targeting structured domains.
teaching_point: |
  Viral IRES elements rely on conserved RNA structure for function. Ensemble analysis reveals
  whether predicted base pairs are consistently formed or fluctuate, guiding antiviral design.
