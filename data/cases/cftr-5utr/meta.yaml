disease: Cystic Fibrosis
gene: CFTR (Cystic Fibrosis Transmembrane Conductance Regulator)
region: 5' UTR and start-codon region (5'UTR 1-70 + CDS 71-200)
why_structure_matters: |
  The CFTR 5' UTR influences translation efficiency. RNA secondary structure in the 5' UTR
  and around the start codon affects ribosome scanning and AUG recognition. Ensemble analysis
  reveals whether the start codon region is accessible for translation initiation or sequestered
  in stable structures that may reduce CFTR expression.
teaching_point: |
  Translation initiation depends on start codon accessibility. Firm structures that occlude the
  AUG in the ensemble (not just the MFE) can reduce protein expression, contributing to disease
  severity in patients with mild CFTR mutations.
