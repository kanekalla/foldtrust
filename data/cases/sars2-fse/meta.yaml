disease: COVID-19
gene: SARS-CoV-2 (Severe Acute Respiratory Syndrome Coronavirus 2)
region: Frameshifting element (ORF1a/ORF1ab −1 ribosomal frameshift)
why_structure_matters: |
  A −1 programmed ribosomal frameshift at this site controls the ratio of ORF1a to ORF1ab
  polyproteins. The slippery sequence UUUAAAC and downstream 3-stem pseudoknot induce
  frameshifting. Ensemble analysis reveals which pseudoknot base pairs are stable and which
  are dynamic, informing antiviral strategies that target the frameshift element.
teaching_point: |
  Programmed frameshifts rely on RNA structure downstream of the slippery site. Ensemble
  pairing probabilities distinguish firm stems (required for frameshifting) from floppy
  regions that may tolerate mutation, guiding small-molecule or antisense inhibitor design.
