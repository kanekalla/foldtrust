disease: Frontotemporal Dementia with Parkinsonism linked to chromosome 17 (FTDP-17)
gene: MAPT (Microtubule-Associated Protein Tau)
region: Exon 10 (NCBI exon 11, classic exon 10) and 5' splice site stem-loop
why_structure_matters: |
  A stem-loop at the exon 10 / intron 10 5' splice site regulates exon 10 inclusion.
  Mutations that strengthen the stem (e.g. intron +3 G>A, +13 A>G, +14 C>T, +16 C>T)
  increase exon 10 inclusion, shifting the tau 4R/3R ratio and causing FTDP-17. Structure
  predictions must capture the stability and pairing probabilities of this regulatory element.
teaching_point: |
  cis-regulatory RNA structures control alternative splicing. Ensemble analysis distinguishes
  mutations that stabilize stems (increasing exon inclusion) from those that destabilize them.
